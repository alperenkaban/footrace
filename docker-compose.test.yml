version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: footquiz-test-postgres
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: footquiz_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d footquiz_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: footquiz-test-redis
    ports:
      - '6380:6379'
    volumes:
      - redis_test_data:/data
    command: redis-server --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_test_data:
  redis_test_data:
